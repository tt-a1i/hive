name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete compatibility matrix
        type: boolean
        default: true
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      full: ${{ steps.plan.outputs.full }}
      native: ${{ steps.plan.outputs.native }}
      extended: ${{ steps.plan.outputs.extended }}
      inputs: ${{ steps.plan.outputs.inputs }}
      tests: ${{ steps.plan.outputs.tests }}
      shards: ${{ steps.plan.outputs.shards }}
      legacy: ${{ steps.plan.outputs.legacy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_FULL: ${{ github.event_name == 'schedule' || inputs.full }}
        run: |
          if [ -z "$CI_BASE_SHA" ]; then
            CI_BASE_SHA="$(git rev-parse HEAD^)"
            export CI_BASE_SHA
          fi
          node scripts/ci-plan.mjs

  verify:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Pack once for tests and platforms
        if: needs.plan.outputs.native == 'true' || needs.plan.outputs.tests == 'true'
        run: |
          mkdir -p ci-package
          npm pack --pack-destination ci-package
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.native == 'true' || needs.plan.outputs.tests == 'true'
        with:
          name: hive-ci-package
          path: ci-package/*.tgz
          if-no-files-found: error
          retention-days: 3

  tests:
    needs: [plan, verify]
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: hive-ci-package
          path: ci-package
      - name: Reuse the verified build
        run: |
          tar -xf ci-package/*.tgz
          cp -R package/dist .
          mkdir -p web
          cp -R package/web/dist web/
      - name: Run affected tests or a full-suite shard
        env:
          CI_FULL: ${{ needs.plan.outputs.full }}
          CI_TEST_INPUTS: ${{ needs.plan.outputs.inputs }}
          CI_TEST_SHARD: ${{ needs.plan.outputs.full == 'true' && format('{0}/{1}', matrix.shard, strategy.job-total) || '' }}
        run: node scripts/ci-plan.mjs --run

  legacy-sqlite:
    needs: plan
    if: needs.plan.outputs.legacy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The old driver is test-only and has no Node 26 native build requirement.
      - run: pnpm rebuild better-sqlite3
      - name: Verify real old/new-driver migration and reverse reads
        env:
          HIVE_TEST_LEGACY_SQLITE: '1'
        run: node scripts/run-tests.mjs tests/unit/sqlite.test.ts

  platforms:
    needs: [plan, verify]
    if: needs.plan.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.18.0', '26']
        install-policy: [both]
        # Windows clean installs dominate the package gate; keep both policies,
        # but run them on isolated runners instead of serially on one runner.
        include:
          - os: windows-latest
            node: '22.18.0'
            install-policy: scriptless
          - os: windows-latest
            node: '22.18.0'
            install-policy: default
          - os: windows-latest
            node: '26'
            install-policy: scriptless
          - os: windows-latest
            node: '26'
            install-policy: default
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        if: matrix.install-policy != 'default'
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g npm@12
        if: matrix.node == '26'
      - uses: actions/download-artifact@v4
        with:
          name: hive-ci-package
          path: ci-package
      - name: Verify scriptless installation
        if: matrix.install-policy != 'default'
        shell: bash
        run: node scripts/pack-smoke.mjs --tarball ci-package/*.tgz
      - name: Verify default installation
        if: matrix.install-policy != 'scriptless'
        shell: bash
        run: node scripts/pack-smoke.mjs --tarball ci-package/*.tgz --default-install
      - name: Reuse the build for platform lifecycle regressions
        if: needs.plan.outputs.extended != 'true' && matrix.install-policy != 'default'
        shell: bash
        run: |
          tar -xf ci-package/*.tgz
          cp -R package/dist .
          mkdir -p web
          cp -R package/web/dist web/
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/run-tests.mjs tests/cli/hive-update-preflight.test.ts tests/unit/windows-command-line.test.ts tests/unit/runtime-database.test.ts tests/server/agent-manager-windows-stop-real.test.ts tests/server/agent-manager-pty-eof.test.ts --testTimeout=60000 --hookTimeout=60000

  extended:
    needs: [plan, verify]
    if: needs.plan.outputs.extended == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.18.0', '26']
        exclude:
          # Already covered by verify, without repeating a full suite.
          - os: ubuntu-latest
            node: '22.18.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: hive-ci-package
          path: ci-package
      - name: Reuse the verified build
        shell: bash
        run: |
          tar -xf ci-package/*.tgz
          cp -R package/dist .
          mkdir -p web
          cp -R package/web/dist web/
      - run: node scripts/run-tests.mjs --no-file-parallelism --maxWorkers=1 --testTimeout=60000 --hookTimeout=60000 --exclude=tests/integration/package-tarball.test.ts
        if: runner.os != 'Windows'
      - run: pnpm test:windows
        if: runner.os == 'Windows'

  result:
    if: always()
    needs: [plan, verify, tests, legacy-sqlite, platforms, extended]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require all selected checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-result.mjs
