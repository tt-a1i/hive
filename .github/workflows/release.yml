name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm install -g node-gyp
        if: runner.os == 'Linux'
      - run: pnpm install --frozen-lockfile
      - run: npm ci
        working-directory: integrations/hive-jev
      - run: pnpm check
      - run: pnpm build
      - run: npm run check
        working-directory: integrations/hive-jev
      - run: npm test
        working-directory: integrations/hive-jev
      - run: python -m unittest test/browser_policy_test.py
        working-directory: integrations/hive-jev
      - run: pnpm vitest run --no-file-parallelism --maxWorkers=1 --testTimeout=60000 --hookTimeout=60000
        if: runner.os != 'Windows'
      - run: pnpm test:windows
        if: runner.os == 'Windows'
      - run: pnpm pack:check
      - run: pnpm pack:smoke

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g node-gyp
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = require('./package.json')
          const tag = process.env.GITHUB_REF_NAME
          const expected = `v${pkg.version}`

          if (tag !== expected) {
            throw new Error(`Release tag ${tag} does not match package version ${expected}`)
          }

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          if (!changelog.includes(`## ${pkg.version} -`)) {
            throw new Error(`CHANGELOG.md is missing an entry for ${pkg.version}`)
          }
          NODE
      - run: pnpm build
      - name: Print publish toolchain
        run: |
          node --version
          npm --version
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
